name: Publish Rust

# rust-v1.2.0 publishes only the Rust crate. Pushing a tag needs write access,
# so an outside contributor cannot trigger this. Set required reviewers on the
# crates-io environment to gate it further.
on:
  push:
    tags: ["rust-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      # crates.io trusted publishing exchanges this OIDC token for a short-lived
      # registry token, so no API token is stored in this repo.
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      # A crates.io version cannot be unpublished, so re-test here rather than
      # assuming CI passed on this commit.
      - name: Contract tests
        run: cargo test --all-features
      - name: The tag matches the crate version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#rust-v}"
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          [ "$TAG" = "$VERSION" ] || {
            echo "::error::tag rust-v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          }
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
