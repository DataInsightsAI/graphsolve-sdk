name: Publish TypeScript

# ts-v1.2.0 publishes only the TypeScript client.
on:
  push:
    tags: ["ts-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # npm trusted publishing, so no NPM_TOKEN. Needs npm 11.5.1 or newer;
      # an older npm falls back to a classic publish and fails with ENEEDAUTH.
      # That is why Node is pinned to 24 here rather than the 18 we support.
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - name: Contract tests
        run: npm test
      - run: npm run build
      - name: The tag matches the package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#ts-v}"
          VERSION=$(node -p "require('./package.json').version")
          [ "$TAG" = "$VERSION" ] || {
            echo "::error::tag ts-v$TAG does not match package.json version $VERSION"
            exit 1
          }
      # npm refuses a scoped first publish without --access public.
      - run: npm publish --access public
