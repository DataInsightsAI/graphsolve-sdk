name: Publish Python

# python-v1.2.0 publishes only the Python client.
on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI trusted publishing, so no API token is stored in this repo.
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Contract tests
        run: |
          pip install -e ".[dev]"
          pytest tests -q
      - name: The tag matches the package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#python-v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG" = "$VERSION" ] || {
            echo "::error::tag python-v$TAG does not match pyproject.toml version $VERSION"
            exit 1
          }
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist
