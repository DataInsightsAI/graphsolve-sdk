[project]
name = "graphsolve"
description = "Client for the GraphSolve engine API: production-network solving, PVT/EOS, flow assurance and transient multiphase flow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Data Insights AI" }]
keywords = ["petroleum", "reservoir", "production", "pvt", "eos", "multiphase", "flow-assurance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
# major.minor tracks the engine API this client speaks; patch is the client's own.
version = "1.0.34"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.urls]
Homepage = "https://graphsolve.ai"
Source = "https://github.com/DataInsightsAI/graphsolve-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphsolve"]

[tool.ruff]
line-length = 100
